name: Auto Release

on:
  push:
    branches: [main]
  # Weekly rebuild to pick up Alpine security patches between Python bumps.
  # Tuesday, the day after Dependabot's Monday run. Publishes only if packages changed.
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build and test only, no push to Docker Hub, no git tag"
        type: boolean
        default: true

jobs:
  auto-release:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.actor == 'dependabot[bot]' ||
      contains(github.event.head_commit.message, 'dependabot')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next patch version
        id: version
        run: |
          LATEST=$(git tag --sort=-v:refname | grep '^v[0-9]\+\.[0-9]\+\.[0-9]\+$' | head -1)
          if [ -z "$LATEST" ]; then
            NEW_TAG="v1.0.1"
          else
            MAJOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | cut -d. -f2)
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEW_TAG"

      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.version.outputs.tag }} \
            -t data-summarizer:release .

      - name: Run functional tests
        run: bash tests/run_tests.sh data-summarizer:release

      # Compare installed packages (Alpine + Python) with the image on Docker Hub.
      # Scheduled runs publish only when something changed; other triggers always publish.
      # Virtual packages (".python-rundeps-<timestamp>") are excluded: their name changes
      # on every upstream rebuild even when no real package does.
      - name: Compare with published image
        id: decide
        run: |
          inventory() {
            docker run --rm --entrypoint sh "$1" -c \
              'apk list -I 2>/dev/null | cut -d" " -f1; ls /usr/local/lib/python3*/site-packages | grep dist-info' \
              | grep -v '^\.' | sort
          }
          docker pull -q abguven/data-summarizer:latest
          inventory abguven/data-summarizer:latest > published.txt
          inventory data-summarizer:release > candidate.txt

          if diff published.txt candidate.txt; then
            CHANGED=false
            echo "No package changes since the published image."
          else
            CHANGED=true
            echo "Package changes detected (see diff above)."
          fi

          PUBLISH=true
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            PUBLISH=false
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$CHANGED" = "false" ]; then
            PUBLISH=false
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Publish: $PUBLISH"

      - name: Login to Docker Hub
        if: ${{ steps.decide.outputs.publish == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: ${{ steps.decide.outputs.publish == 'true' }}
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          docker tag data-summarizer:release abguven/data-summarizer:$VERSION
          docker tag data-summarizer:release abguven/data-summarizer:latest
          docker push abguven/data-summarizer:$VERSION
          docker push abguven/data-summarizer:latest

      - name: Create git tag
        if: ${{ steps.decide.outputs.publish == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}
